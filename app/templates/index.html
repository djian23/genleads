{% extends "base.html" %}
{% block content %}
<div class="bg-white rounded-lg shadow p-6 mb-8">
    <h2 class="text-xl font-semibold mb-4">Rechercher des prospects</h2>
    <form hx-post="/api/scrape" hx-target="#results-area" hx-swap="innerHTML">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Domaine / Type de business
                </label>
                <input type="text" name="business_type" required
                       placeholder="ex: restaurant, plombier, dentiste"
                       class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Localisation
                </label>
                <input type="text" name="location" required
                       placeholder="ex: Paris, Lyon 3eme"
                       class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Nombre de prospects
                </label>
                <input type="number" name="requested_count" value="20" min="1" max="200"
                       class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        <button type="submit"
                class="mt-4 bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition-colors">
            Lancer la recherche
        </button>
    </form>
</div>

<div id="results-area">
    <!-- HTMX injectera les resultats ici -->
</div>
{% endblock %}
